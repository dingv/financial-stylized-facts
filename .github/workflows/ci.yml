name: Tests and real-data examples

on:
  push:
    branches: [main]
    paths: ["src/**", "tests/**", "data/examples/**", "examples/**", "pyproject.toml", "environment.yml", "README.md", ".github/workflows/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conda-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-python312:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash -el {0}
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb # v4.1.0
        with:
          miniforge-version: latest
          environment-file: environment.yml
          activate-environment: financial-stylized-facts
          auto-activate: false
      - name: Install in the dedicated Conda environment
        run: |
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Run tests
        run: python -m pytest -q
      - name: Generate reports from bundled real market data
        run: python examples/run_reports.py --dataset all --output "$RUNNER_TEMP/fsf-real-examples"
